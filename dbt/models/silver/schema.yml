version: 2

models:
  - name: silver_listings_cleaned
    description: Cleaned listing-level data with normalized identifiers, dates, prices, booleans, and review metrics.
    columns:
      - name: listing_id
        description: Unique Airbnb listing identifier.
        tests:
          - not_null
          - unique
      - name: host_id
        description: Airbnb host identifier.
        tests:
          - not_null
      - name: price
        description: Listing price converted from currency text to numeric value.
        tests:
          - positive_or_null
      - name: availability_365
        description: Number of available days in the next 365 days.
        tests:
          - between_or_null:
              arguments:
                min_value: 0
                max_value: 365
      - name: room_type
        description: Airbnb room type.
        tests:
          - accepted_values:
              arguments:
                values:
                  - Entire home/apt
                  - Private room
                  - Shared room
                  - Hotel room

  - name: silver_hosts
    description: Cleaned host-level table derived from listings, one row per host.
    columns:
      - name: host_id
        description: Unique Airbnb host identifier.
        tests:
          - not_null
          - unique
      - name: observed_listing_count
        description: Number of listings observed for the host in the cleaned listing source.
        tests:
          - positive_or_null

  - name: silver_locations
    description: Cleaned Bangkok neighbourhood reference enriched with observed listing counts and average coordinates.
    columns:
      - name: location_key
        description: Stable hash key for a neighbourhood.
        tests:
          - not_null
          - unique
      - name: neighbourhood
        description: Neighbourhood name.
        tests:
          - not_null
      - name: listing_count
        description: Number of cleaned listings observed in this neighbourhood.
        tests:
          - positive_or_null

  - name: silver_calendar
    description: Cleaned daily listing availability and price table.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - listing_id
              - calendar_date
    columns:
      - name: listing_id
        description: Airbnb listing identifier.
        tests:
          - not_null
      - name: calendar_date
        description: Calendar date.
        tests:
          - not_null
      - name: price
        description: Daily price converted from currency text to numeric value.
        tests:
          - positive_or_null
      - name: adjusted_price
        description: Adjusted daily price converted from currency text to numeric value.
        tests:
          - positive_or_null

  - name: silver_reviews
    description: Cleaned review table, one row per review.
    columns:
      - name: review_id
        description: Unique review identifier.
        tests:
          - not_null
          - unique
      - name: listing_id
        description: Airbnb listing identifier.
        tests:
          - not_null
      - name: review_date
        description: Date when the review was posted.
        tests:
          - not_null

  - name: silver_cleaning_audit
    description: Audit table recording row counts and basic cleaning quality checks for Silver models.
    columns:
      - name: model_name
        tests:
          - not_null
          - unique
      - name: row_count
        tests:
          - positive_or_null
      - name: duplicate_key_count
        tests:
          - positive_or_null
      - name: null_key_count
        tests:
          - positive_or_null
      - name: invalid_metric_count
        tests:
          - positive_or_null
