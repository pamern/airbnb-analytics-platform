version: 2

models:
  - name: dim_listing
    description: Current-state listing dimension with descriptive listing attributes only.
    columns:
      - name: listing_key
        description: Surrogate key for the listing dimension row.
        tests:
          - not_null
          - unique
      - name: listing_id
        description: Natural listing identifier from the source.
        tests:
          - not_null
          - unique
      - name: latitude
        description: Listing latitude stored as a descriptive location attribute.
        tests:
          - between_or_null:
              arguments:
                min_value: -90
                max_value: 90
      - name: longitude
        description: Listing longitude stored as a descriptive location attribute.
        tests:
          - between_or_null:
              arguments:
                min_value: -180
                max_value: 180

  - name: dim_host
    description: Current-state host dimension (SCD Type 1) with the latest observed host attributes from the source.
    columns:
      - name: host_key
        description: Surrogate key for the host dimension row.
        tests:
          - not_null
          - unique
      - name: host_id
        description: Natural host identifier from the source.
        tests:
          - not_null
          - unique
      - name: source_last_scraped_date
        description: Most recent source scrape date used for the current host record.
        tests:
          - not_null

  - name: dim_location
    description: Location dimension at one row per city and neighbourhood.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city
              - neighbourhood
      - location_member_exists:
          arguments:
            city: "{{ env_var('AIRBNB_CITY', 'Bangkok') }}"
            neighbourhood: UNKNOWN
    columns:
      - name: location_key
        description: Surrogate key for the location dimension row.
        tests:
          - not_null
          - unique
      - name: city
        description: City name used for the dataset.
        tests:
          - not_null
      - name: neighbourhood
        description: Listing neighbourhood.
        tests:
          - not_null

  - name: dim_date
    description: Calendar date dimension used by daily and event facts.
    columns:
      - name: date_key
        description: Integer date key in YYYYMMDD format.
        tests:
          - not_null
          - unique
      - name: date_day
        description: Actual calendar date.
        tests:
          - not_null
          - unique

  - name: fact_listing_current_snapshot
    description: Current-state listing snapshot fact at one row per listing and latest scrape date.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - listing_key
              - snapshot_date_key
      - row_count_matches:
          arguments:
            compare_model: ref('silver_listings')
      - unknown_location_ratio_below
    columns:
      - name: listing_snapshot_key
        description: Primary key for the current listing snapshot fact row.
        tests:
          - not_null
          - unique
      - name: listing_key
        description: Foreign key to dim_listing.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_listing')
                field: listing_key
      - name: host_key
        description: Foreign key to dim_host.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_host')
                field: host_key
      - name: location_key
        description: Foreign key to dim_location.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key
      - name: snapshot_date_key
        description: Foreign key to dim_date representing the latest scrape date.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: last_review_date_key
        description: Nullable foreign key to dim_date for the last observed review date.
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: listing_id
        description: Degenerate natural identifier kept for traceability to Silver and source data.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_listing')
                field: listing_id
      - name: listing_snapshot_price
        description: Latest listing price from the listing snapshot source.
        tests:
          - positive_or_null
      - name: estimated_occupancy_l365d
        description: Estimated occupied days over the trailing 365-day window carried from the listing source.
        tests:
          - positive_or_null
      - name: estimated_revenue_l365d
        description: Estimated revenue over the trailing 365-day window carried from the listing source.
        tests:
          - positive_or_null
      - name: number_of_reviews_l30d
        description: Number of reviews observed in the last 30 days from the source listing snapshot.
        tests:
          - positive_or_null
      - name: number_of_reviews_ly
        description: Number of reviews observed in the prior year from the source listing snapshot.
        tests:
          - positive_or_null
      - name: listing_count
        description: Additive count measure fixed to 1 for each listing snapshot row.
        tests:
          - accepted_values:
              arguments:
                values: [1]

  - name: fact_availability_daily
    description: Daily availability fact at one row per listing and calendar date.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - listing_key
              - calendar_date_key
      - row_count_matches:
          arguments:
            compare_model: ref('silver_calendar')
      - unknown_location_ratio_below
    columns:
      - name: availability_daily_key
        description: Primary key for the daily availability fact row.
        tests:
          - not_null
          - unique
      - name: listing_key
        description: Foreign key to dim_listing.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_listing')
                field: listing_key
      - name: host_key
        description: Foreign key to dim_host.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_host')
                field: host_key
      - name: location_key
        description: Foreign key to dim_location.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key
      - name: calendar_date_key
        description: Foreign key to dim_date.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: listing_id
        description: Degenerate natural identifier kept for traceability to Silver and source data.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_listing')
                field: listing_id

  - name: fact_review
    description: Review event fact at one row per review.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - review_id
      - row_count_matches:
          arguments:
            compare_model: ref('silver_reviews')
      - unknown_location_ratio_below
    columns:
      - name: review_key
        description: Primary key for the review fact row.
        tests:
          - not_null
          - unique
      - name: listing_key
        description: Foreign key to dim_listing.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_listing')
                field: listing_key
      - name: host_key
        description: Foreign key to dim_host.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_host')
                field: host_key
      - name: location_key
        description: Foreign key to dim_location.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key
      - name: review_date_key
        description: Foreign key to dim_date.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: review_id
        description: Natural review identifier from the source.
        tests:
          - not_null
          - unique
      - name: listing_id
        description: Degenerate natural identifier kept for traceability to Silver and source data.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_listing')
                field: listing_id
      - name: review_count
        description: Additive count measure fixed to 1 for each review event row.
        tests:
          - accepted_values:
              arguments:
                values: [1]

  - name: gold_cluster_model_features
    description: Gold feature table for the listing segmentation KMeans model. It contains cleaned business features, feature engineering, and imputation, but does not apply one-hot encoding or scaling.
    tests:
      - not_empty
    columns:
      - name: feature_hash
        description: Stable MD5 of the raw KMeans input features, used for incremental scoring.
        tests:
          - not_null
      - name: listing_id
        description: Unique Airbnb listing identifier. Used as an identifier only, not as a KMeans feature.
        tests:
          - not_null
          - unique
      - name: price
        description: Positive listing price kept for segment price analysis, not used as a KMeans feature.
        tests:
          - not_null
          - greater_than:
              arguments:
                value: 0
      - name: room_type
        description: Airbnb room type. Used as a categorical KMeans feature.
        tests:
          - not_null
      - name: property_type
        description: Cleaned original property type from the Silver listing model.
      - name: property_base_group
        description: Property type grouped into model-friendly categories. Used as a categorical KMeans feature.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Serviced Apartment / Aparthotel
                  - Hostel
                  - Guesthouse / B&B
                  - Hotel / Resort
                  - Villa
                  - Apartment / Condo
                  - House / Home
                  - Niche / Special Stay
                  - Unspecified Property Type
      - name: accommodates
        description: Number of guests the listing can accommodate. Used as a numeric KMeans feature.
        tests:
          - not_null
          - non_negative
      - name: bedrooms
        description: Bedroom count after room-type median imputation. Used as a numeric KMeans feature.
        tests:
          - not_null
          - non_negative
      - name: bathrooms
        description: Bathroom count after room-type median imputation. Used as a numeric KMeans feature.
        tests:
          - not_null
          - non_negative
      - name: beds
        description: Bed count after room-type median imputation. Used as a numeric KMeans feature.
        tests:
          - not_null
          - non_negative
      - name: amenities_count
        description: Number of amenities parsed from the Silver amenities field. Used as a numeric KMeans feature.
        tests:
          - not_null
          - non_negative
      - name: minimum_nights
        description: Original minimum nights value from Silver, retained for analysis.
      - name: minimum_nights_log
        description: Natural log transform of one plus the non-negative minimum nights value. Used as a numeric KMeans feature.
        tests:
          - not_null
          - non_negative

  - name: gold_price_model_features
    description: Listing-level feature mart and log-transformed price target for price-model training and evaluation.
    columns:
      - name: feature_hash
        description: Stable MD5 of the raw price-model input features, used for incremental scoring.
        tests:
          - not_null
      - name: listing_id
        description: Natural listing identifier and unique row key for the price-model feature set.
        tests:
          - not_null
          - unique
      - name: host_id
        description: Natural identifier of the listing host.
      - name: neighbourhood
        description: Neighbourhood of the listing.
      - name: property_type
        description: Source property type of the listing.
      - name: room_type
        description: Source room type of the listing.
      - name: price
        description: Original listing price used to validate and invert the log-price prediction target. This column must not be used as a model feature.
        tests:
          - not_null
          - positive_or_null
      - name: accommodates
        description: Maximum number of guests the listing accommodates.
      - name: bathrooms
        description: Number of bathrooms reported for the listing.
      - name: bedrooms
        description: Number of bedrooms reported for the listing.
      - name: beds
        description: Number of beds reported for the listing.
      - name: minimum_nights
        description: Minimum required number of nights for a booking.
      - name: maximum_nights
        description: Maximum allowed number of nights for a booking.
      - name: instant_bookable
        description: Whether the listing supports instant booking.
      - name: host_response_time
        description: Categorical host response-time bucket.
      - name: host_response_rate
        description: Host response rate from the source listing record.
      - name: host_acceptance_rate
        description: Host acceptance rate from the source listing record.
      - name: host_is_superhost
        description: Whether the host is designated as a superhost.
      - name: host_listings_count
        description: Count of listings declared by the host.
      - name: host_total_listings_count
        description: Total listing count declared by the host.
      - name: calculated_host_listings_count
        description: Listing count calculated by the source for the host.
      - name: number_of_reviews
        description: Lifetime number of reviews for the listing.
      - name: number_of_reviews_ltm
        description: Number of reviews in the last twelve months.
      - name: reviews_per_month
        description: Average number of reviews received per month.
      - name: review_scores_rating
        description: Overall review rating score.
      - name: review_scores_accuracy
        description: Review score for listing accuracy.
      - name: review_scores_cleanliness
        description: Review score for cleanliness.
      - name: review_scores_checkin
        description: Review score for check-in experience.
      - name: review_scores_communication
        description: Review score for host communication.
      - name: review_scores_location
        description: Review score for location.
      - name: review_scores_value
        description: Review score for value.
      - name: has_reviews
        description: Binary feature indicating whether the listing has at least one review.
      - name: amenities_count
        description: Number of amenities parsed from the source JSON array when valid.
      - name: log_price
        description: Natural-log transformed listing price, calculated as ln(1 + price), used as the prediction target.
        tests:
          - not_null


  - name: gold_ai_qa_investment_recommendations
    description: Gold AI mart for investment recommendations, evaluating Airbnb market-entry opportunities by neighbourhood and room type. It calculates opportunity score, risk score, action tier, confidence level, and risk flags from aggregate Gold data only. It must not be interpreted as actual ROI or guaranteed profitability because operating cost and booking transaction data are not available.
    tests:
      - not_empty
    columns:
      - name: neighbourhood
        description: Airbnb neighbourhood being evaluated.
        tests:
          - not_null
      - name: recommended_room_type
        description: Room type candidate for the investment opportunity.
        tests:
          - not_null
      - name: listing_count
        description: Number of positive-price listings in the neighbourhood. Used for both confidence and competition risk.
        tests:
          - not_null
          - non_negative
      - name: room_type_listing_count
        description: Number of positive-price listings for the recommended neighbourhood and room type.
        tests:
          - not_null
          - non_negative
      - name: opportunity_score
        description: Score from 0 to 100 based on estimated revenue, estimated occupancy, competition zone, and room-type confidence.
        tests:
          - not_null
          - between_or_null:
              arguments:
                min_value: 0
                max_value: 100
      - name: risk_score
        description: Score from 0 to 100 based on low sample size, saturation, low demand, price trap, and room-type confidence risk.
        tests:
          - not_null
          - between_or_null:
              arguments:
                min_value: 0
                max_value: 100
      - name: opportunity_level
        description: Bucketing of opportunity_score into High, Medium, or Low.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['High', 'Medium', 'Low']
      - name: risk_level
        description: Bucketing of risk_score into High, Medium, or Low.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['High', 'Medium', 'Low']
      - name: action_tier
        description: Final investment action bucket for the LLM and dashboard.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Strong Invest
                  - Investigate Further
                  - Stable but Low Priority
                  - Avoid
      - name: confidence_level
        description: Data confidence level based on neighbourhood and room-type sample size plus risk score.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['High', 'Medium', 'Low']
      - name: risk_flags
        description: Semicolon-separated risk labels used as evidence for LLM recommendations.
